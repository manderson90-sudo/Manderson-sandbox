<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-GB' }}">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#f8f9fb">

  <title>
    {% if page.title %}
      {{ page.title | escape }} | {{ site.title | escape }}
    {% else %}
      {{ site.title | escape }} | Technology &amp; Digital Transformation Leadership
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | strip_html | normalize_whitespace | escape }}"
  >

  <link
    rel="canonical"
    href="{{ page.url | absolute_url }}"
  >

  <!-- SHARED STYLESHEET -->

  <link
    rel="stylesheet"
    href="{{ '/assets/css/styles.css' | relative_url }}?v=8"
  >

</head>

<body>

  <!-- ACCESSIBILITY: SKIP NAVIGATION -->

  <a class="skip-link" href="#main-content">
    Skip to main content
  </a>


  <!-- SHARED HEADER -->

  {% include header.html %}


  <!-- PAGE CONTENT -->

  <main id="main-content">

    {{ content }}

  </main>


  <!-- SHARED FOOTER -->

  {% include footer.html %}


  <!-- SHARED JAVASCRIPT -->

  <script
    src="{{ '/assets/js/main.js' | relative_url }}"
    defer
  ></script>


  <!-- QUALIFICATIONS FILTERING -->

  <script
    src="{{ '/assets/js/qualifications.js' | relative_url }}"
    defer
  ></script>

</body>

</html>
