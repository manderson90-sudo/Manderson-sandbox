<!-- ======================================================
     MICHAEL ANDERSON
     SHARED WEBSITE FOOTER

     Navigation links are managed in:
     _data/navigation.yml
     ====================================================== -->

<footer class="site-footer">

  <div class="container footer-grid">

    <!-- NAME AND ROLE -->

    <div>

      <strong>
        Michael Anderson
      </strong>

      <p>
        Technology Leader
      </p>

    </div>


    <!-- FOOTER NAVIGATION -->

    <nav aria-label="Footer navigation">

      {% for item in site.data.navigation %}

        <a
          href="{{ item.url | relative_url }}"
          {% if page.url == item.url %}
            aria-current="page"
          {% endif %}
        >
          {{ item.title }}
        </a>

      {% endfor %}

    </nav>


    <!-- CONTACT LINKS -->

    <div>

      <a
        href="https://www.linkedin.com/in/michaelanderson90"
        target="_blank"
        rel="noopener noreferrer"
      >
        LinkedIn
        <span class="sr-only">
          (opens in a new tab)
        </span>
      </a>

      <a href="mailto:m.anderson90@icloud.com">
        Email
      </a>

    </div>

  </div>


  <!-- COPYRIGHT AND LEGAL LINKS -->

  <div class="container copyright">

    <span class="footer-copyright-text">
      &copy; {{ 'now' | date: '%Y' }} Michael Anderson.
      All rights reserved.
    </span>

    <nav
      class="footer-legal-links"
      aria-label="Legal information"
    >

      <a
        href="{{ '/terms/' | relative_url }}"
        {% if page.url == '/terms/' %}
          aria-current="page"
        {% endif %}
      >
        Website Terms &amp; Disclaimer
      </a>

      <span
        class="footer-legal-separator"
        aria-hidden="true"
      >
        ·
      </span>

      <a
        href="{{ '/privacy/' | relative_url }}"
        {% if page.url == '/privacy/' %}
          aria-current="page"
        {% endif %}
      >
        Privacy Policy
      </a>

    </nav>

  </div>

</footer>


<!-- ======================================================
     FOOTER LEGAL LINK STYLING
     ====================================================== -->

<style>

  .site-footer .copyright {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem 1.5rem;
  }

  .footer-legal-links {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.65rem;
    font-size: inherit;
  }

  .footer-legal-links a {
    color: inherit;
    text-decoration: none;
    text-underline-offset: 0.2em;
  }

  .footer-legal-links a:hover,
  .footer-legal-links a:focus-visible {
    text-decoration: underline;
  }

  .footer-legal-links a[aria-current="page"] {
    text-decoration: underline;
  }

  .footer-legal-separator {
    opacity: 0.6;
  }

  @media (max-width: 768px) {

    .site-footer .copyright {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
    }

  }

</style>
